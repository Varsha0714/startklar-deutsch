<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Practice for the Goethe A1 and A2 German exams: listening, vocabulary, reading, writing and speaking, with a plan that adapts to your weak spots.">
<meta name="theme-color" content="#2743C9">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}</style>
<title>Startklar Deutsch</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Startklar">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&family=Playwrite+DE+Grund:wght@300;400&display=swap">
<style>
:root{
  --paper:#F6F7FB; --grid:rgba(39,67,201,.075); --card:#FFFFFF; --card-2:#F0F2F9;
  --ink:#1B2140; --ink-2:#4A5170; --ink-3:#737A96; --line:#DCDFEA;
  --blue:#2743C9; --blue-ink:#FFFFFF; --blue-soft:#E7EBFC;
  --red:#C9352A; --red-soft:#FBE8E6; --green:#1B7F52; --green-soft:#E1F3EA;
  --amber:#A86B12; --amber-soft:#FBF0DC;
  --shadow:0 1px 2px rgba(27,33,64,.06),0 4px 14px rgba(27,33,64,.05);
  --f-display:"Jost","Futura","Avenir Next","Century Gothic",system-ui,sans-serif;
  --f-body:"Source Sans 3","Source Sans Pro",-apple-system,"Segoe UI",system-ui,sans-serif;
  --f-hand:"Playwrite DE Grund","Bradley Hand","Segoe Print",cursive;
  --r:14px; --r-s:9px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#11152A; --grid:rgba(143,163,255,.06); --card:#1A1F3A; --card-2:#222847;
    --ink:#E9EBF7; --ink-2:#B5BAD7; --ink-3:#8A91B4; --line:#2D3456;
    --blue:#93A6FF; --blue-ink:#10142A; --blue-soft:#252E5E;
    --red:#FF8175; --red-soft:#3B2030; --green:#55D39C; --green-soft:#173628;
    --amber:#EDB552; --amber-soft:#3A2F1A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#11152A; --grid:rgba(143,163,255,.06); --card:#1A1F3A; --card-2:#222847;
  --ink:#E9EBF7; --ink-2:#B5BAD7; --ink-3:#8A91B4; --line:#2D3456;
  --blue:#93A6FF; --blue-ink:#10142A; --blue-soft:#252E5E;
  --red:#FF8175; --red-soft:#3B2030; --green:#55D39C; --green-soft:#173628;
  --amber:#EDB552; --amber-soft:#3A2F1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px; background-attachment:fixed;
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{max-width:580px;margin:0 auto;padding-inline:16px;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.wordmark{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.wordmark .dot{width:9px;height:9px;border-radius:2px;background:var(--blue);display:inline-block;transform:translateY(-2px)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;letter-spacing:.02em;padding:4px 10px;border-radius:999px;background:var(--blue-soft);color:var(--blue);border:0}
.pill.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2)}
.sync{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);display:inline-block}
.sync.ok i{background:var(--green)}

h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:30px;font-weight:600;letter-spacing:-.015em;line-height:1.1}
h2{font-size:20px;font-weight:600;letter-spacing:-.005em}
h3{font-size:16px;font-weight:600}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)} .small{font-size:13.5px} .tiny{font-size:12px;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.section{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.ink{background:var(--blue);color:var(--blue-ink);border-color:transparent}
.card.ink .muted,.card.ink .tiny,.card.ink .eyebrow{color:inherit;opacity:.78}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:11px 16px;font-weight:600;font-size:15.5px;min-height:46px;transition:transform .08s ease,background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--blue);color:var(--blue-ink);border-color:transparent}
.btn.ink-on{background:var(--blue-ink);color:var(--blue);border-color:transparent}
.btn.block{width:100%}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);font-weight:600;font-size:14px}

/* countdown hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.days{font-family:var(--f-display);font-weight:600;font-size:64px;line-height:.85;letter-spacing:-.03em}
.days small{display:block;font-size:14px;letter-spacing:.02em;font-weight:500;margin-top:8px}
.scoreline{position:relative;height:10px;border-radius:5px;background:rgba(255,255,255,.22);overflow:visible;margin-top:8px}
.scoreline b{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--blue-ink)}
.scoreline .pass{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--blue-ink);opacity:.9}
.scoreline .pass::after{content:"60";position:absolute;top:-16px;left:-6px;font-size:10.5px;font-weight:700}

/* plan list */
.plan{display:flex;flex-direction:column;gap:0;margin:4px 0 12px}
.plan-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px dashed var(--line)}
.plan-row:first-child{border-top:0}
.plan-ico{width:28px;height:28px;border-radius:8px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.plan-ico svg{width:16px;height:16px}
.why{font-size:13px;color:var(--ink-2);margin-top:2px}

.hand{font-family:var(--f-hand);font-weight:300;color:var(--red);font-size:14px;line-height:1.7}
.hand.blue{color:var(--blue)} .hand.green{color:var(--green)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;min-height:96px}
.tile .t-title{font-family:var(--f-display);font-weight:600;font-size:16px}
.tile.accent{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

/* meters */
.meter{height:8px;border-radius:4px;background:var(--card-2);overflow:hidden;position:relative}
.meter b{display:block;height:100%;border-radius:4px;background:var(--blue)}
.meter.good b{background:var(--green)} .meter.warn b{background:var(--amber)} .meter.bad b{background:var(--red)}
.mrow{display:grid;grid-template-columns:minmax(92px,34%) 1fr 48px;gap:10px;align-items:center;padding:6px 0}
.mrow .lbl{font-size:14.5px;font-weight:600}
.mrow .val{text-align:right;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink-2)}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card)}
.chip.red{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.green{background:var(--green-soft);color:var(--green);border-color:transparent}
.chip.amber{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.blue{background:var(--blue-soft);color:var(--blue);border-color:transparent}

.weak{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.weak:first-child{border-top:0}
.weak .pct{font-family:var(--f-display);font-weight:600;font-size:20px;color:var(--red)}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar-in{max-width:580px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--ink-3);border-radius:10px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--blue)}

/* runner */
.runner{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.runner-top{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:580px;width:100%;margin:0 auto}
.xbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.prog{flex:1;height:8px;border-radius:4px;background:var(--card-2);overflow:hidden}
.prog b{display:block;height:100%;background:var(--blue);transition:width .3s ease}
.runner-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.runner-in{max-width:580px;margin:0 auto;padding-inline:16px;padding-block:8px 24px;display:flex;flex-direction:column;gap:14px}
.runner-foot{border-top:1px solid var(--line);background:var(--card);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.runner-foot-in{max-width:580px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.runner-foot.good{background:var(--green-soft);border-color:transparent}
.runner-foot.bad{background:var(--red-soft);border-color:transparent}
.fb-title{font-family:var(--f-display);font-weight:600;font-size:18px}
.runner-foot.good .fb-title{color:var(--green)} .runner-foot.bad .fb-title{color:var(--red)}

.tag{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--blue)}
.prompt{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.prompt.de{font-size:30px}
.art{font-weight:500;color:var(--ink-3)}
.q{font-size:18px;font-weight:600;line-height:1.3}

/* answer sheet options */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;min-height:54px;position:relative}
.opt .box{width:30px;height:30px;border:1.5px solid var(--ink-3);border-radius:6px;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--ink-2)}
.opt.sel{border-color:var(--blue)} .opt.sel .box{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.opt.right{border-color:var(--green);background:var(--green-soft)} .opt.right .box{background:var(--green);border-color:var(--green);color:var(--card)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)} .opt.wrong .box{background:var(--red);border-color:var(--red);color:var(--card)}
.opt.wrong .otext .de{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.opt:disabled{cursor:default}
.rf{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rf .opt{grid-template-columns:30px 1fr}

/* player */
.player{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.play{width:58px;height:58px;border-radius:50%;background:var(--blue);color:var(--blue-ink);border:0;display:grid;place-items:center;flex:none}
.play svg{width:24px;height:24px}
.play.playing{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--blue-soft)}}
.wave{display:flex;gap:3px;align-items:center;height:26px}
.wave i{width:3px;border-radius:2px;background:var(--ink-3);opacity:.5}
.playing-wave i{background:var(--blue);opacity:1;animation:wv .9s ease-in-out infinite}
@keyframes wv{50%{transform:scaleY(.4)}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 10px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue)}

.transcript{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:15.5px;display:flex;flex-direction:column;gap:6px}
.transcript .sp{font-weight:700;color:var(--ink-3);font-size:12px;letter-spacing:.06em;margin-right:6px}
.transcript mark{background:var(--amber-soft);color:inherit;border-bottom:2px solid var(--amber);padding:0 2px;border-radius:2px}

.text-doc{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;font-size:16px;white-space:pre-wrap;box-shadow:var(--shadow);line-height:1.5}
.text-doc.sign{border:2px solid var(--ink);border-radius:4px;font-weight:600;text-align:center;font-family:var(--f-display);white-space:pre-wrap}
.ads{display:grid;grid-template-columns:1fr;gap:10px}
.ad{background:var(--card);border:1.5px dashed var(--ink-3);border-radius:8px;padding:12px;font-size:15px;white-space:pre-wrap;text-align:left;width:100%}
.ad b.lt{font-family:var(--f-display);font-size:18px;margin-right:6px}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.02em}
.input,textarea.input{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--card);padding:12px 13px;font-size:17px;min-height:48px}
.input:focus{border-color:var(--blue);outline:none}
textarea.input{min-height:150px;resize:vertical;line-height:1.45}
.input.right{border-color:var(--green);background:var(--green-soft)} .input.wrong{border-color:var(--red);background:var(--red-soft)}
.umlauts{display:flex;gap:6px}
.umlauts button{min-width:44px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:17px;font-weight:600}
.checklist{display:flex;flex-direction:column;gap:6px;font-size:15px}
.ck{display:flex;gap:9px;align-items:flex-start}
.ck i{flex:none;width:20px;height:20px;border-radius:5px;border:1.5px solid var(--ink-3);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;margin-top:1px}
.ck.on i{background:var(--green);border-color:var(--green);color:var(--card)}
.ck.off i{border-color:var(--red);color:var(--red)}

.bildkarte{width:112px;height:112px;border-radius:14px;border:2px solid var(--ink);display:grid;place-items:center;font-size:54px;background:var(--card);margin:4px auto}
.wortkarte{border:2px solid var(--ink);border-radius:10px;padding:14px;text-align:center;background:var(--card);max-width:260px;margin:0 auto;width:100%}
.wortkarte .thema{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.wortkarte .wort{font-family:var(--f-display);font-size:26px;font-weight:600;margin-top:6px}

.bars{display:flex;align-items:flex-end;gap:4px;height:92px;padding-top:6px;border-bottom:1px solid var(--line)}
.bars .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.bars .bar b{display:block;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px}
.bars .bar.today b{background:var(--ink)}
.bars .bar.zero b{background:var(--line)}
.bars-x{display:flex;gap:4px;margin-top:4px}
.bars-x span{flex:1;text-align:center;font-size:10.5px;color:var(--ink-3)}

.list-btn{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.list-btn .sub{font-size:13px;color:var(--ink-2)}
.chev{color:var(--ink-3)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.notice{border-radius:12px;padding:12px 14px;background:var(--amber-soft);color:var(--ink);font-size:14px}
.notice b{color:var(--amber)}
.ai-out{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:10px;padding:12px 14px;font-size:15px;white-space:pre-wrap}
.correction{display:grid;grid-template-columns:1fr;gap:2px;padding:8px 0;border-top:1px dashed var(--line)}
.correction:first-child{border-top:0}
.correction s{color:var(--red);text-decoration-thickness:2px}
.correction ins{color:var(--green);text-decoration:none;font-weight:600}
.summary-num{font-family:var(--f-display);font-weight:600;font-size:56px;line-height:1;letter-spacing:-.02em}
details.more summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:14px}
hr.rule{border:0;border-top:1px solid var(--line);margin:4px 0}
.set-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0}
select.input{min-height:42px;padding:8px 10px;font-size:16px;width:auto}
input[type=date].input{min-height:42px;padding:8px 10px;width:auto}

/* English help */
.h-en{font-size:13px;color:var(--ink-3);margin-top:2px;font-weight:500}
.en-q{font-size:13.5px;color:var(--ink-3);margin-top:3px;line-height:1.35}
.otext{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px;min-width:0}
.otext .en{font-size:12.5px;color:var(--ink-3);font-weight:400;margin-left:auto;text-align:right;line-height:1.3}
.opt.right .otext .en{color:var(--green)} .opt.wrong .otext .en{color:var(--red)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12px;font-weight:600;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:3px 10px}
/* today + countdown */
.today-box{background:color-mix(in srgb,var(--blue-ink) 13%,transparent);border-radius:12px;padding:12px 14px}
.today-t{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.15;margin-top:2px}
.linkbtn.on-ink{color:var(--blue-ink);text-decoration:underline;text-underline-offset:3px;align-self:center;padding:4px}
.cd-strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;margin-inline:-16px;padding:2px 16px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cd-strip::-webkit-scrollbar{display:none}
.cd{flex:0 0 136px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 11px;display:flex;flex-direction:column;gap:3px}
.cd-date{font-size:11.5px;color:var(--ink-3);font-weight:700;letter-spacing:.03em}
.cd-mark{font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--blue)}

 ex:"Verspätung = delay. 20 minutes late, so not pünktlich (on time)."},
{id:"h2-02",lvl:"A1",part:2,topic:"einkaufen",traps:["place"],
 s:[["N","Liebe Kundinnen und Kunden! Heute im Erdgeschoss: alle Jacken und Mäntel dreißig Prozent billiger. Nur heute!"]],
 qs:[{q:"Jacken sind heute billiger.",o:RF,a:0}],key:"dreißig Prozent billiger",
 ex:"billiger = cheaper. Erdgeschoss = ground floor."},
{id:"h2-03",lvl:"A1",part:2,topic:"verkehr",traps:["place"],
 s:[["N","Passagiere des Fluges LH vierhundertzwei nach Wien: Bitte kommen Sie sofort zum Ausgang B zwölf. Der Flug ist bereit zum Einsteigen."]],
 qs:[{q:"Die Passagiere nach Wien sollen zu Ausgang B 12 gehen.",o:RF,a:0}],key:"Ausgang B zwölf",
 ex:"At the airport „Ausgang“ = gate. zwölf = 12."},
{id:"h2-04",lvl:"A1",part:2,topic:"einkaufen",traps:["number","time"],
 s:[["N","Liebe Kunden, unser Markt schließt in fünfzehn Minuten. Bitte gehen Sie jetzt zur Kasse. Vielen Dank für Ihren Einkauf."]],
 qs:[{q:"Der Supermarkt schließt in 50 Minuten.",o:RF,a:1}],key:"in fünfzehn Minuten",
 ex:"fünfzehn = 15, fünfzig = 50. Listen for „-zehn“ vs „-zig“."},
{id:"h2-05",lvl:"A1",part:2,topic:"wetter",traps:["time"],
 s:[["N","Und jetzt das Wetter für morgen: Am Vormittag ist es sonnig und warm, bis fünfundzwanzig Grad. Am Abend kann es regnen."]],
 qs:[{q:"Morgen regnet es den ganzen Tag.",o:RF,a:1}],key:"Am Abend kann es regnen",
 ex:"Sunny in the morning, only maybe rain in the evening — not the whole day („den ganzen Tag“)."},
{id:"h2-06",lvl:"A1",part:2,topic:"verkehr",traps:["change"],
 s:[["N","Eine Information für unsere Fahrgäste: Die U-Bahn-Linie zwei fährt heute wegen Bauarbeiten nicht. Bitte nehmen Sie den Bus siebenundfünfzig."]],
 qs:[{q:"Man soll heute mit dem Bus fahren.",o:RF,a:0}],key:"Bitte nehmen Sie den Bus",
 ex:"The U2 doesn't run („fährt nicht“), so take bus 57."},
{id:"h2-07",lvl:"A1",part:2,topic:"freizeit",traps:["day"],
 s:[["N","Das Hallenbad ist am Montag geschlossen. Von Dienstag bis Sonntag ist das Bad von sieben bis einundzwanzig Uhr geöffnet."]],
 qs:[{q:"Am Montag kann man schwimmen.",o:RF,a:1}],key:"am Montag geschlossen",
 ex:"geschlossen = closed on Monday."},
{id:"h2-08",lvl:"A1",part:2,topic:"arbeit",traps:["time","change"],
 s:[["N","Achtung, eine Information für die Teilnehmer vom Deutschkurs A1: Der Kurs beginnt heute nicht um neun, sondern um halb zehn. Wir sind in Raum vierzehn."]],
 qs:[{q:"Der Kurs beginnt heute um 9:30 Uhr.",o:RF,a:0}],key:"sondern um halb zehn",
 ex:"„nicht X, sondern Y“ = not X but Y. halb zehn = 9:30 (half TO ten!)."},
{id:"h2-09",lvl:"A1",part:2,topic:"verkehr",traps:["number"],
 s:[["N","Nächster Halt: Frankfurt Hauptbahnhof. Sie haben Anschluss an den Regionalexpress nach Mainz. Abfahrt vierzehn Uhr zweiundfünfzig von Gleis zwölf."]],
 qs:[{q:"Der Zug nach Mainz fährt von Gleis 2.",o:RF,a:1}],key:"von Gleis zwölf",
 ex:"zwölf = 12, not zwei (2)."},
{id:"h2-10",lvl:"A1",part:2,topic:"einkaufen",traps:["place"],
 s:[["N","Liebe Kunden, der kleine Tim sucht seine Mutter. Tim wartet an der Information im ersten Stock."]],
 qs:[{q:"Tim wartet im Erdgeschoss.",o:RF,a:1}],key:"im ersten Stock",
 ex:"erster Stock = first floor (one floor up). Erdgeschoss = ground floor."},
{id:"h2-11",lvl:"A1",part:2,topic:"verkehr",traps:["time"],
 s:[["N","Liebe Fahrgäste, der Bus nach Oberstadt fährt heute nur bis achtzehn Uhr. Danach fährt ein Taxi-Bus. Bitte rufen Sie eine Stunde vorher an."]],
 qs:[{q:"Nach 18 Uhr fährt kein Bus nach Oberstadt.",o:RF,a:0}],key:"nur bis achtzehn Uhr",
 ex:"The bus runs only until 18:00; after that a taxi-bus you have to call."},

{id:"h3-01",lvl:"A1",part:3,topic:"freizeit",traps:["day"],
 s:[["A","Hallo Maria, hier ist Jonas. Ich kann heute leider nicht zum Sport kommen. Ich bin krank. Können wir am Freitag zusammen gehen? Ruf mich bitte an. Tschüss!"]],
 qs:[{q:"Warum ruft Jonas an?",o:["Er kommt heute nicht zum Sport.","Er möchte am Samstag Sport machen.","Er hat eine neue Telefonnummer."],a:0}],key:"kann heute leider nicht",
 ex:"„leider nicht“ = unfortunately not. He suggests Freitag, not Samstag."},
{id:"h3-02",lvl:"A1",part:3,topic:"gesundheit",traps:["time","change"],
 s:[["A","Guten Tag, Herr Özdemir, hier ist die Praxis Dr. Lehmann. Ihr Termin morgen um acht Uhr geht leider nicht. Können Sie um Viertel nach elf kommen? Bitte rufen Sie uns kurz zurück. Danke."]],
 qs:[{q:"Wann soll Herr Özdemir kommen?",o:["Um 8:00 Uhr","Um 11:15 Uhr","Um 10:45 Uhr"],a:1}],key:"um Viertel nach elf",
 ex:"Viertel nach elf = quarter past eleven = 11:15. (Viertel vor elf would be 10:45.)"},
{id:"h3-03",lvl:"A1",part:3,topic:"essen",traps:["negation"],
 s:[["A","Hallo Schatz, ich bin noch im Büro. Kannst du bitte Brot und Tomaten kaufen? Käse haben wir noch. Die Kinder möchten heute Abend Pizza machen. Bis später!"]],
 qs:[{q:"Was soll er kaufen?",o:["Brot und Tomaten","Pizza","Brot und Käse"],a:0}],key:"Brot und Tomaten",
 ex:"Cheese: „haben wir noch“ (we still have). Pizza is what the kids will make, not buy."},
{id:"h3-04",lvl:"A1",part:3,topic:"wohnen",traps:["day","time"],
 s:[["A","Guten Tag, hier ist Möbel Krause. Ihr Sofa ist da. Wir bringen es am Mittwoch zwischen vierzehn und sechzehn Uhr. Ist das in Ordnung? Unsere Nummer ist null acht neun, zwölf, vierunddreißig, sechsundfünfzig."]],
 qs:[{q:"Wann kommt das Sofa?",o:["Am Montag","Am Mittwoch am Vormittag","Am Mittwoch am Nachmittag"],a:2}],key:"zwischen vierzehn und sechzehn Uhr",
 ex:"14–16 Uhr is the afternoon (Nachmittag)."},
{id:"h3-05",lvl:"A1",part:3,topic:"stadt",traps:["number","change"],
 s:[["A","Hi, hier ist Lena. Die Party am Samstag ist nicht bei mir, sondern bei Tom. Die Adresse ist Goethestraße achtzehn, im dritten Stock. Bis dann!"]],
 qs:[{q:"Wo ist die Party?",o:["Bei Lena","Goethestraße 18","Goethestraße 80"],a:1}],key:"Goethestraße achtzehn",
 ex:"„nicht bei mir, sondern bei Tom“. achtzehn = 18, achtzig = 80."},
{id:"h3-06",lvl:"A1",part:3,topic:"einkaufen",traps:["price","number"],
 s:[["A","Guten Tag, Frau Jansen, hier ist die Autowerkstatt Beck. Ihr Auto ist fertig. Die Reparatur kostet zweihundertfünfundvierzig Euro. Sie können das Auto heute bis achtzehn Uhr abholen."]],
 qs:[{q:"Wie viel kostet die Reparatur?",o:["245 €","254 €","425 €"],a:0}],key:"zweihundertfünfundvierzig",
 ex:"zweihundert-fünf-und-vierzig = 200 + 5 + 40 = 245."},
{id:"h3-07",lvl:"A1",part:3,topic:"arbeit",traps:["date"],
 s:[["A","Hier ist das Sekretariat der Sprachschule Lingua. Ihr Deutschkurs beginnt am vierzehnten Oktober. Bitte bringen Sie am ersten Tag Ihren Pass mit. Vielen Dank."]],
 qs:[{q:"Was soll man mitbringen?",o:["Ein Foto","Den Pass","Geld"],a:1}],key:"Ihren Pass mit",
 ex:"„mitbringen“ = bring along. Pass = passport."},
{id:"h3-08",lvl:"A1",part:3,topic:"verkehr",traps:["change"],
 s:[["A","Hallo, hier ist Mama. Wir kommen am Sonntag nicht mit dem Zug, sondern mit dem Auto. Wir sind so um zwölf Uhr bei euch. Bis Sonntag!"]],
 qs:[{q:"Wie kommen die Eltern?",o:["Mit dem Zug","Mit dem Auto","Mit dem Bus"],a:1}],key:"sondern mit dem Auto",
 ex:"„nicht mit dem Zug, sondern mit dem Auto“."},
{id:"h3-09",lvl:"A1",part:3,topic:"essen",traps:["time"],
 s:[["A","Guten Abend, hier ist das Restaurant Adria. Sie haben für heute einen Tisch für vier Personen reserviert. Leider haben wir um neunzehn Uhr keinen Tisch frei. Geht es auch um zwanzig Uhr? Bitte rufen Sie uns an."]],
 qs:[{q:"Was ist das Problem?",o:["Das Restaurant ist heute geschlossen.","Um 19 Uhr ist kein Tisch frei.","Der Tisch ist zu klein."],a:1}],key:"um neunzehn Uhr keinen Tisch frei",
 ex:"„keinen Tisch frei“ = no free table at 19:00; they offer 20:00."},
{id:"h3-10",lvl:"A1",part:3,topic:"arbeit",traps:["number","change"],
 s:[["A","Hallo Frau Weber, hier ist Klaus Maier. Die Besprechung morgen ist nicht in Raum fünf, sondern in Raum zwölf, im zweiten Stock. Bis morgen!"]],
 qs:[{q:"Wo ist die Besprechung?",o:["In Raum 5","In Raum 12","In Raum 2"],a:1}],key:"sondern in Raum zwölf",
 ex:"„zweiten Stock“ is the floor, not the room. Room = zwölf (12)."},
{id:"h3-11",lvl:"A1",part:3,topic:"kommunikation",traps:["time"],
 s:[["A","Guten Tag, hier ist die Post am Marktplatz. Ihr Paket ist da. Sie können es ab morgen abholen. Wir haben von Montag bis Freitag von neun bis achtzehn Uhr geöffnet, am Samstag bis zwölf."]],
 qs:[{q:"Wann kann man das Paket am Samstag abholen?",o:["Bis 12 Uhr","Bis 18 Uhr","Am Samstag nicht"],a:0}],key:"am Samstag bis zwölf",
 ex:"Saturday only until twelve (zwölf)."},

{id:"a2h1-01",lvl:"A2",part:1,topic:"a2umwelt",traps:["time"],
 s:[["N","Und nun das Wetter. Heute Vormittag ist es in ganz Bayern noch neblig. Ab Mittag scheint die Sonne, die Temperaturen steigen auf achtzehn Grad. Am Abend kommen aus dem Westen Gewitter."]],
 qs:[{q:"Wie wird das Wetter am Nachmittag?",o:["Neblig","Sonnig","Es gibt Gewitter"],a:1}],key:"Ab Mittag scheint die Sonne",

{id:"a2h1-02",lvl:"A2",part:1,topic:"a2reisen",traps:["change","place"],
 s:[["N","Achtung, eine Durchsage für die Reisenden nach Köln: Ihr Zug fährt heute ausnahmsweise nicht von Gleis acht, sondern von Gleis fünfzehn ab. Bitte beachten Sie außerdem: Der Wagen der ersten Klasse ist heute am Ende des Zuges."]],

{id:"a2h1-03",lvl:"A2",part:1,topic:"a2feste",traps:["price"],
 s:[["N","Liebe Hörerinnen und Hörer, am Wochenende ist wieder Stadtfest! Am Samstag gibt es Musik auf dem Marktplatz, am Sonntag ein großes Kinderprogramm im Park. Der Eintritt ist frei, nur für das Konzert am Samstagabend braucht man eine Karte für zwölf Euro."]],

 ex:"„Der Eintritt ist frei, nur für …“ = free except for the evening concert."},
{id:"a2h1-04",lvl:"A2",part:1,topic:"a2gesundheit",traps:["time","day"],
 s:[["A","Guten Tag, hier ist die Praxis Dr. Schneider. Wir sind vom zwölften bis zum dreiundzwanzigsten August im Urlaub. In dringenden Fällen gehen Sie bitte zu Dr. Aydin in der Parkstraße. Ab dem vierundzwanzigsten August sind wir wieder für Sie da."]],
 qs:[{q:"Ab wann ist die Praxis wieder geöffnet?",o:["Ab dem 12. August","Ab dem 23. August","Ab dem 24. August"],a:2}],key:"Ab dem vierundzwanzigsten August",
 ex:"Holiday 12–23 August; open again from the 24th."},

{id:"a2h3-01",lvl:"A2",part:3,topic:"a2wohnen",traps:["change"],
 s:[["A","Hast du schon eine neue Wohnung gefunden?"],["B","Ja, endlich! Sie ist nicht so groß wie meine alte, aber sie hat einen Balkon und die Nebenkosten sind niedrig."],["A","Und wann ziehst du um?"],["B","Eigentlich wollte ich schon im Oktober umziehen, aber die Wohnung ist erst ab November frei."]],

{id:"a2h3-02",lvl:"A2",part:3,topic:"a2arbeit",traps:["time"],
 s:[["A","Wie war dein Vorstellungsgespräch?"],["B","Ganz gut, glaube ich. Die Stelle ist interessant, aber ich müsste jeden Tag eine Stunde mit dem Zug fahren."],["A","Und das Gehalt?"],["B","Das ist in Ordnung. Sie sagen mir bis Freitag Bescheid."]],
 qs:[{q:"Was findet der Mann nicht so gut?",o:["Das Gehalt","Den langen Arbeitsweg","Die Arbeit"],a:1}],key:"jeden Tag eine Stunde mit dem Zug",
 ex:"The job is interesting, the salary is okay; the problem is the long commute."},
{id:"a2h3-03",lvl:"A2",part:3,topic:"a2medien",traps:["negation"],
 s:[["A","Mein Handy ist schon wieder leer. Der Akku hält nur noch drei Stunden."],["B","Kauf doch ein neues!"],["A","Ach, das Handy ist erst ein Jahr alt. Ich bringe es lieber zur Reparatur. Vielleicht bekomme ich einen neuen Akku."]],
 qs:[{q:"Was macht die Frau?",o:["Sie kauft ein neues Handy.","Sie bringt das Handy zur Reparatur.","Sie kauft ein Ladegerät."],a:1}],key:"Ich bringe es lieber zur Reparatur",
 ex:"„lieber“ = rather: she prefers repair over buying."},

const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
function deOrd(n) { // dative: am ersten, am dritten ...
  const irr = { 1: "ersten", 3: "dritten", 7: "siebten", 8: "achten" };
  if (irr[n]) return irr[n];
  return n < 20 ? deNum(n) + "ten" : deNum(n) + "sten";
}
const LETTERS = {a:"A",b:"Be",c:"Tse",d:"De",e:"E",f:"Eff",g:"Ge",h:"Ha",i:"I",j:"Jott",k:"Ka",l:"Ell",m:"Emm",n:"Enn",o:"O",p:"Pe",q:"Kuh",r:"Err",s:"Ess",t:"Te",u:"U",v:"Fau",w:"We",x:"Iks",y:"Ypsilon",z:"Zett","ä":"Ä","ö":"Ö","ü":"Ü"};
const SPELL_NAMES = ["Berger","Weiß","Vogel","Jansen","Kiefer","Brehm","Pieper","Seidel","Wagner","Yilmaz","Diehl","Tietz","Engel","Ivanov","Jäger","Gerber","Heine","Wiegand"];
const SWAPS = [["e","i"],["i","e"],["v","w"],["w","v"],["b","p"],["p","b"],["d","t"],["t","d"],["j","y"],["g","k"],["ie","ei"],["ei","ie"],["h","a"]];

function uniqOpts(correct, cands, n = 3) {
  const out = [correct];
  for (const c of shuffle(cands)) { if (out.length >= n) break; if (!out.includes(c)) out.push(c); }
  let guard = 0; while (out.length < n && guard++ < 20) { const c = correct.replace(/(\d)(\D*)$/, (m, d, rest) => ((+d + guard) % 10) + rest); if (!out.includes(c)) out.push(c); }

}
function fmtTime(h, m) { return h + ":" + String(m).padStart(2, "0"); }

function makeDrill(type) {
  let say, ans, cands;
  if (type === "num") {
    const pairs = [[13,30],[14,40],[15,50],[16,60],[17,70],[18,80],[19,90]];
    if (Math.random() < .45) { const p = pick(pairs); const n = pick(p); say = deNum(n); ans = String(n); cands = [String(p[0]), String(p[1]), String(p[0] + (p[1] === n ? 1 : 10))]; }
    else { let n = 21 + rnd(78); if (n % 10 === 0) n++; const sw = Number(String(n).split("").reverse().join("")); const big = Math.random() < .35 ? 100 * (1 + rnd(8)) : 0; say = deNum(big + n); ans = String(big + n); cands = [String(big + sw), String(big + n + 10), String(big + n - 1)]; }
  } else if (type === "price") {
    const e = 1 + rnd(19), c = 10 + rnd(89); const cs = String(c).padStart(2, "0"); const csw = String(Number(String(c).split("").reverse().join(""))).padStart(2, "0");
    say = deNum(e) + " Euro " + deNum(c); if (e === 1) say = "ein Euro " + deNum(c);
    ans = e + "," + cs + " €"; cands = [e + "," + csw + " €", (e + 1) + "," + cs + " €", c + "," + String(e).padStart(2, "0") + " €"];
  } else if (type === "time") {
    const h = 1 + rnd(11); const kind = pick(["halb", "halb", "nach", "vor", "min"]); let hh = h, mm = 0;
    const next = h % 12 + 1;
    if (kind === "halb") { say = "halb " + deNum(next); hh = h; mm = 30; cands = [fmtTime(next, 30), fmtTime(h, 15), fmtTime(next, 0)]; }
    else if (kind === "nach") { say = "Viertel nach " + deNum(h === 1 ? 1 : h).replace(/^eins$/, "eins"); mm = 15; cands = [fmtTime(h, 45), fmtTime(next, 15), fmtTime(h, 30)]; }
    else if (kind === "vor") { say = "Viertel vor " + deNum(next); mm = 45; cands = [fmtTime(next, 45), fmtTime(next, 15), fmtTime(h, 15)]; }
    else { const m = pick([5, 10, 20]); const v = Math.random() < .5; if (v) { say = deNum(m) + " vor " + deNum(next); hh = h; mm = 60 - m; cands = [fmtTime(next, m), fmtTime(h, m), fmtTime(next, 60 - m)]; } else { say = deNum(m) + " nach " + deNum(h); mm = m; cands = [fmtTime(h, 60 - m), fmtTime(h - 1 || 12, 60 - m), fmtTime(next, m)]; } }
    say = "Es ist " + say + "."; ans = fmtTime(hh, mm);
  } else if (type === "clock") {
    const h = 6 + rnd(17), m = pick([5, 10, 15, 20, 25, 35, 40, 45, 50, 52, 13, 17, 38]);
    say = deNum(h) + " Uhr " + deNum(m); ans = fmtTime(h, m);

  } else if (type === "date") {

    const d2 = d < 10 ? d + 10 : d <= 20 ? (d === 10 ? 20 : d - 10) : d - 20;
    const moAlt = mo === 2 ? 4 : mo === 4 ? 2 : mo === 5 ? 6 : mo === 6 ? 5 : (mo + 1) % 12;
    cands = [d2 + ". " + MONTHS[mo], d + ". " + MONTHS[moAlt], d2 + ". " + MONTHS[moAlt]];
  } else if (type === "phone") {
    const g = [rnd(90) + 10, rnd(90) + 10, rnd(90) + 10].map(x => (x % 10 && x % 11) ? x : (x > 95 ? x - 3 : x + 2));
    const pre = pick(["0176", "0151", "030", "089", "0221"]);
    say = pre.split("").map(d => ONES[+d]).join(" ") + ", " + g.map(deNum).join(", ");
    const f = a => pre + " " + a.join(" ");
    ans = f(g); const rev = n => Number(String(n).split("").reverse().join(""));
    cands = [f([rev(g[0]), g[1], g[2]]), f([g[0], rev(g[1]), g[2]]), f([g[0], g[1], rev(g[2])])];
  } else { // spell
    const name = pick(SPELL_NAMES); const low = name.toLowerCase();
    say = low.split("").map(ch => ch === "ß" ? "Eszett" : LETTERS[ch] || ch).join(", ");
    ans = name; cands = [];
    for (const [x, y] of shuffle(SWAPS)) { if (low.includes(x)) { const alt = low.replace(x, y); cands.push(alt[0].toUpperCase() + alt.slice(1)); } if (cands.length >= 4) break; }

// ---------- state ----------
const TODAY = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const dayNum = (iso = TODAY()) => Math.floor(Date.parse(iso + "T12:00:00") / 864e5);
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
function freshState() {
  return { v: 2, level: "A1", exam: { A1: "2026-10-06", A2: "2026-12-15" }, rate: 0.9, showEn: true, doneDays: {},
    words: {}, items: {}, skills: {}, days: {}, mocks: [], writing: [], gen: [], mistakes: [], updatedAt: 0, created: Date.now() };
}
let S = freshState();

const Store = {
  db: null, uid: null, status: "local", saving: false, dirty: false, timer: null,
  LS: "startklar-v1",
  loadLocal() { try { const raw = localStorage.getItem(this.LS); if (raw) return JSON.parse(raw); } catch (e) {} return null; },
  saveLocal() { try { localStorage.setItem(this.LS, JSON.stringify(S)); } catch (e) {} },
  ref() { return this.db.doc("data/users/" + this.uid + "/progress"); },
  async connect(onChange) {
    try {
      if (!window.claude?.use) return;
      const [user, db] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
      if (!user || !db) return;
      const uid = await user.id(); if (!uid) return;
      this.db = db; this.uid = uid;
      const snap = await this.ref().get();
      if (snap.exists) {
        const remote = snap.data();
        if ((remote.updatedAt || 0) > (S.updatedAt || 0)) { S = normalize(JSON.parse(JSON.stringify(remote))); this.saveLocal(); onChange(); }
        else if ((S.updatedAt || 0) > (remote.updatedAt || 0)) this.queue(0);
      } else if (S.updatedAt) this.queue(0);
      this.status = "cloud"; onChange();
    } catch (e) { this.db = null; this.status = "local"; onChange(); }
  },
  save() { S.updatedAt = Date.now(); this.saveLocal(); if (this.db) this.queue(2500); },
  queue(ms) { this.dirty = true; clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), ms); },
  async flush() {
    if (!this.db || !this.dirty) return;
    if (this.saving) { this.queue(1500); return; }
    this.saving = true; this.dirty = false;
    try { await this.ref().set(JSON.parse(JSON.stringify(S))); }
    catch (e) { if (e && e.code === "unavailable") this.queue(4000); else if (e && (e.code === "revoked" || e.code === "invalid_argument")) { this.db = null; this.status = "local"; } }
    finally { this.saving = false; }
  }
};
function normalize(s) {
  const f = freshState(); for (const k in f) if (s[k] === undefined) s[k] = f[k];
  if (!s.v || s.v < 2) { s.exam.A1 = "2026-10-06"; s.v = 2; } // exam booked for Tue 6 Oct 2026
  if (!s.exam.A2) s.exam.A2 = f.exam.A2; return s;
}

// ---------- speech ----------
const TTS = {
  ok: "speechSynthesis" in window, voices: [], playing: false, token: 0,
  init() {
    if (!this.ok) return;
    const load = () => {
      const all = speechSynthesis.getVoices().filter(v => /^de(-|_|$)/i.test(v.lang));
      const score = v => (/premium|enhanced|natural|neural/i.test(v.name) ? 4 : 0) + (/de-DE/i.test(v.lang) ? 2 : 0) + (v.localService ? 1 : 0);
      this.voices = all.sort((a, b) => score(b) - score(a));
    };
    load(); speechSynthesis.onvoiceschanged = load;
  },
  hasGerman() { return this.voices.length > 0; },
  stop() { this.token++; this.playing = false; if (this.ok) speechSynthesis.cancel(); },
  // lines: [[speaker, text], ...]
  play(lines, { rate = S.rate, onend, onstart } = {}) {
    if (!this.ok) { onend && onend(false); return; }
    this.stop(); const my = ++this.token; this.playing = true; onstart && onstart();
    const v0 = this.voices[0], v1 = this.voices.find(v => v !== v0 && v.name.split(" ")[0] !== v0?.name.split(" ")[0]) || this.voices[1];
    let i = 0;
    const next = () => {
      if (my !== this.token) return;
      if (i >= lines.length) { this.playing = false; onend && onend(true); return; }
      const [sp, text] = lines[i++];
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "de-DE"; u.rate = rate;
      if (sp === "B") { if (v1) u.voice = v1; else { if (v0) u.voice = v0; u.pitch = 0.75; } }
      else { if (v0) u.voice = v0; u.pitch = sp === "N" ? 0.95 : 1.05; }
      u.onend = () => setTimeout(next, 380); u.onerror = () => setTimeout(next, 50);
      speechSynthesis.speak(u);
    };
    next();
  },
  say(text, opts) { this.play([["A", text]], opts); }
};

// ---------- learning engine ----------
const BOX_DAYS = [0, 1, 2, 4, 7, 14, 30];
function skill(key) { return S.skills[key] || (S.skills[key] = { n: 0, c: 0, e: 0.5 }); }
function record(keys, ok) {
  for (const k of keys) { const s = skill(k); s.n++; if (ok) s.c++; s.e = s.e * 0.78 + (ok ? 1 : 0) * 0.22; s.t = dayNum(); }
  const d = S.days[TODAY()] || (S.days[TODAY()] = { q: 0, c: 0 }); d.q++; if (ok) d.c++;
}
function skillVal(key) { const s = S.skills[key]; return s ? s.e : null; }

function wordState(wid) { return S.words[wid]; }
function gradeWord(w, ok, mode, artOk = true) {
  const st = S.words[w.id] || (S.words[w.id] = { b: 0, d: 0, n: 0, c: 0, x: 0 });
  st.n++;
  if (ok) { st.c++; st.b = Math.min(6, st.b + 1); }
  else { st.x++; st.b = Math.max(1, st.b - 2); }
  st.d = dayNum() + (ok ? BOX_DAYS[st.b] : 0);
  record(["topic." + w.topic, "vocab." + mode], ok);
  if (w.art && mode === "recall") record(["vocab.article"], artOk);

}
function recordItem(kind, item, qi, ok) {

  const st = S.items[key] || (S.items[key] = { n: 0, c: 0 });
  st.n++; if (ok) st.c++; st.last = dayNum(); st.ok = ok;
  const keys = [kind + "." + item.lvl + "." + item.part, "topic." + item.topic];

function addMistake(m) { S.mistakes = S.mistakes.filter(x => !(x.t === m.t && x.id === m.id)); S.mistakes.unshift({ ...m, d: dayNum() }); S.mistakes = S.mistakes.slice(0, 60); }

const lvlWords = (lvl = S.level) => Object.values(WORDS).filter(w => w.lvl === lvl);

function topicMastery(tid) {
  const ws = TOPICS[tid].words; let sum = 0;
  for (const w of ws) { const s = S.words[w.id]; if (s) sum += Math.min(1, s.b / 4); }
  return sum / ws.length;
}

const allHoeren = () => HOEREN.concat(S.gen || []);

function modulePart(mod, part, lvl = S.level) { return skillVal(mod + "." + lvl + "." + part); }
function moduleScore(mod, lvl = S.level) {

  const ps = partsOf(mod, lvl); let sum = 0, n = 0;

function weaknesses(limit = 5) {

    const k = mod + "." + lvl + "." + p, s = S.skills[k]; if (s && s.n >= 2) out.push({ k, v: s.e, n: s.n, label: MOD_NAME[mod] + " Teil " + p, sub: PART_INFO[lvl][mod][p], go: { mod, part: p } });
  }
  for (const t in TRAP_INFO) { const s = S.skills["trap." + t]; if (s && s.n >= 3) out.push({ k: "trap." + t, v: s.e, n: s.n, label: "Hör-Falle: " + TRAP_INFO[t][0], sub: TRAP_INFO[t][1], go: { trap: t } }); }
  for (const t in DRILL_INFO) { const s = S.skills["drill." + t]; if (s && s.n >= 4) out.push({ k: "drill." + t, v: s.e, n: s.n, label: "Hörtraining: " + DRILL_INFO[t][0], sub: DRILL_INFO[t][1], go: { drill: t } }); }
  for (const t of topicsFor(lvl)) { const s = S.skills["topic." + t.id]; if (s && s.n >= 4) out.push({ k: "topic." + t.id, v: s.e, n: s.n, label: "Thema: " + t.de, sub: t.en, go: { topic: t.id } }); }
  const a = S.skills["vocab.article"]; if (a && a.n >= 5) out.push({ k: "vocab.article", v: a.e, n: a.n, label: "Artikel (der/die/das)", sub: "noun genders", go: { article: true } });

const MOD_NAME = { hoeren: "Hören", lesen: "Lesen", schreiben: "Schreiben", sprechen: "Sprechen" };

function daysLeft() { return dayNum(S.exam[S.level]) - dayNum(); }
function phase() {
  const d = daysLeft();

  if (d <= 2) return { key: "final", label: "Letzte Tage", sub: "Light review: your mistakes, due words, one short Hören set. Sleep well." };
  if (d <= 7) return { key: "mock", label: "Prüfungstraining", sub: "Exam-mode practice and a mock test every other day." };

// ---------- choosing items ----------
function itemScore(kind, it) {
  // lower = more useful now: previously wrong first, then unseen, then least recently seen
  let best = 99;
  const qs = it.qs || [0];
  qs.forEach((q, i) => {
    const st = S.items[kind + ":" + it.id + (qs.length > 1 ? "#" + i : "")];
    const sc = !st ? 1 : (st.ok === false ? 0 : 2 + Math.min(20, dayNum() - (st.last || 0)) * -0.05 + st.c * 0.3);
    best = Math.min(best, sc);
  });
  return best + Math.random() * 0.4;
}
function chooseItems(pool, kind, n, filter = () => true) {
  return pool.filter(filter).map(it => ({ it, s: itemScore(kind, it) })).sort((a, b) => a.s - b.s).slice(0, n).map(x => x.it);
}
function weakestPart(mod, lvl = S.level) {
  const ps = partsOf(mod, lvl).filter(p => (mod === "hoeren" ? allHoeren() : mod === "lesen" ? LESEN : SCHREIBEN).some(x => x.lvl === lvl && x.part === p) || mod === "sprechen");
  return ps.map(p => ({ p, v: modulePart(mod, p, lvl) ?? 0.45 - Math.random() * 0.1 })).sort((a, b) => a.v - b.v)[0]?.p;
}
function weakestDrills(n = 2) {
  const lvlTypes = Object.keys(DRILL_INFO);
  return lvlTypes.map(t => ({ t, v: (skillVal("drill." + t) ?? 0.4) + Math.random() * 0.12 })).sort((a, b) => a.v - b.v).slice(0, n).map(x => x.t);
}
function weakestTopicWithNew(lvl = S.level) {
  const ts = topicsFor(lvl).filter(t => newWords(t.id).length);
  if (!ts.length) return null;
  // prefer topics you are weak at but have started; otherwise the least covered
  return ts.map(t => ({ t, v: (skillVal("topic." + t.id) ?? 0.55) * 0.6 + topicMastery(t.id) * 0.4 + Math.random() * 0.08 })).sort((a, b) => a.v - b.v)[0].t.id;
}

// ---------- building tasks ----------
function vocabTask(w, forceMode) {
  const st = S.words[w.id]; const b = st ? st.b : 0;
  const mode = forceMode || (b <= 1 ? "recognize" : b === 2 ? "listen" : b === 3 ? "choose" : "recall");
  return { kind: "vocab", wid: w.id, mode };
}

function distractorWords(w, n) {
  const same = TOPICS[w.topic].words.filter(x => x.id !== w.id && !!x.art === !!w.art && x.en !== w.en);
  const pool = same.length >= n ? same : lvlWords(w.lvl).filter(x => x.id !== w.id && x.en !== w.en);
  return shuffle(pool).slice(0, n);

    const sv = skillVal("topic." + tid);

  }

  }

  return { title: cd ? cd.t : "Heute", en: cd ? cd.en : "Today's plan", tasks, blocks, mins };
}

function buildMock() {

  },
  schreiben(t, st) {
    const it = sItem(t.id);
    if (it.fields) {
      return `<div class="tag">Schreiben · Teil 1 · Formular</div><div class="text-doc">${esc(it.text)}</div>
        <div class="card stack">${it.fields.map((f, i) => `<div class="field"><label for="f${i}">${esc(f.label)}</label><input id="f${i}" class="input ${st.done ? (st.fieldOk?.[i] ? "right" : "wrong") : ""}" autocomplete="off" autocorrect="off" spellcheck="false" value="${esc(st.vals?.[i] || "")}" ${st.done ? "disabled" : ""}>${st.done && !st.fieldOk?.[i] ? `<div class="hand">→ ${esc(f.acc[0].replace(/(^|\s)\S/g, s => s.toUpperCase()))}</div>` : ""}</div>`).join("")}</div>`;

      ${st.done ? `<details class="more"><summary>Musterlösung ansehen</summary><div class="text-doc" style="margin-top:8px">${esc(it.model)}</div></details>${aiBlock("w")}` : ""}`;
  },
  sprechen(t, st) {
    const lvl = S.level, sp = SPRECHEN[lvl];

    if (!st.cards) {

    const head = `<div class="tag">Sprechen · Teil ${t.part}</div><div class="tiny">${esc(PART_INFO[lvl].sprechen[t.part])}</div>`;
    const area = (i, ph, rows = 3) => `<textarea id="sp${i}" class="input" style="min-height:${rows * 34}px" placeholder="${esc(ph)}" autocapitalize="sentences" spellcheck="false" ${st.done ? "readonly" : ""}>${esc(st.vals[i] || "")}</textarea>`;

        <div class="tiny">In the exam you'll also spell your name (<i>Buchstabieren</i>) and say a number (phone, house number).</div>${area(0, "Hallo! Ich heiße …", 5)}${dictTip}

    } else if (type === "card") {
      body = st.cards.map((c, i) => `<div class="wortkarte"><div class="thema">Thema: ${esc(c.thema)}</div><div class="wort">${esc(c.wort)}</div></div>
        <div class="small">Ask your partner a question with this word${lvl === "A1" ? ", then answer it yourself" : ""}.</div>${area(i, "Frage … ? Antwort …", 3)}

        ${area(0, "Am Wochenende …", 6)}${dictTip}
        ${st.done ? `<div class="checklist">${ck(st.pts[0], "At least 40 words (" + wordCount(st.vals[0]) + ")")}${ck(st.pts[1], "Connectors: und, aber, dann, weil, oft …")}</div><details class="more"><summary>Beispiel ansehen</summary><div class="text-doc" style="margin-top:8px">${esc(c.model)}</div><button class="btn small" style="margin-top:8px" data-act="say" data-text="${esc(c.model)}">${ic("play", 14)} Anhören</button></details>` : ""}`;

function qBlock(it, st) {
  return it.qs.map((q, qi) => `<div class="stack-s"><div><div class="q">${it.qs.length > 1 ? `<span class="tiny num">${qi + 1}.</span> ` : ""}${esc(q.q)}</div>${enOn() && q.en ? `<div class="en-q">${esc(q.en)}</div>` : ""}</div>${optList(q.o, st, qi, q.a, q.oen)}</div>`).join("");
}
function ck(state, label) { return `<div class="ck ${state === true ? "on" : state === false ? "off" : ""}"><i>${state === true ? "✓" : state === false ? "✗" : ""}</i><span>${esc(label)}</span></div>`; }
function hilite(text, key) { const e = esc(text); if (!key) return e; const k = esc(key); const i = e.indexOf(k); return i < 0 ? e : e.slice(0, i) + "<mark>" + k + "</mark>" + e.slice(i + k.length); }
function speedSeg() { const r = S.rate; return `<div class="row"><span class="tiny">Tempo</span><div class="seg" role="group" aria-label="Speech speed">${[[0.7, "langsam"], [0.9, "normal"], [1.02, "Prüfung"]].map(([v, l]) => `<button data-act="rate" data-v="${v}" aria-pressed="${Math.abs(r - v) < 0.01}">${l}</button>`).join("")}</div></div>`; }

// ---------- footers (before answering) ----------
const FOOTS = {
  learn: () => `<button class="btn primary block" data-act="learn-ok">Weiter</button>`,
  vocab: (t) => t.mode === "recall" ? `<div class="row"><button class="btn" data-act="recall-skip" style="flex:1">Weiß ich nicht</button><button class="btn primary" data-act="recall-check" style="flex:2">Prüfen</button></div>` : `<div class="tiny" style="text-align:center">Tap an answer</div>`,
  article: () => `<div class="tiny" style="text-align:center">Tap der, die or das</div>`,
  drill: () => `<div class="tiny" style="text-align:center">Tap an answer · replay as often as you need</div>`,
  hoeren: (t, st) => { const it = hItem(t.id); const ready = it.qs.every((_, i) => st.sel?.[i] !== undefined); return `<button class="btn primary block" data-act="multi-check" ${ready ? "" : "disabled"}>${R.mock ? "Antwort speichern" : "Prüfen"}</button>`; },
  lesen: (t, st) => { const it = lItem(t.id); const ready = it.qs.every((_, i) => st.sel?.[i] !== undefined); return `<button class="btn primary block" data-act="multi-check" ${ready ? "" : "disabled"}>${R.mock ? "Antwort speichern" : "Prüfen"}</button>`; },
  schreiben: () => `<button class="btn primary block" data-act="write-check">Prüfen</button>`,
  sprechen: () => `<button class="btn primary block" data-act="speak-check">Prüfen & Beispiel zeigen</button>`

// ---------- actions inside the runner ----------
function playDrill() {
  const t = task(); R.st.plays = (R.st.plays || 0) + 1;
  TTS.play([["A", t.say]], { rate: t.exam ? 1.0 : t.type === "spell" ? Math.min(S.rate, 0.85) : S.rate, onstart: () => setPlaying(true), onend: () => setPlaying(false) });
}
function setPlaying(on) { if (!R) return; R.st.playing = on; const b = $("#runner .play"); if (b) b.classList.toggle("playing", on); const w = $("#runner .wave")?.parentElement; if (w) w.classList.toggle("playing-wave", on); }
function playHoeren() {
  const t = task(), it = hItem(t.id); const lim = playLimit(t);
  if ((R.st.plays || 0) >= lim) return;
  R.st.plays = (R.st.plays || 0) + 1;
  TTS.play(it.s, { rate: t.exam ? 1.0 : S.rate, onstart: () => setPlaying(true), onend: () => { setPlaying(false); if (R && R.st.plays >= lim) renderRunner(false); else { const n = $("#runner .player .tiny"); if (n) n.textContent = R.st.plays + "× gehört"; } } });
  const n = $("#runner .player .tiny"); if (n) n.textContent = "läuft …";
}
function pickOption(q, i) {
  const t = task(), st = R.st; if (st.done) return;
  st.sel = st.sel || []; st.sel[q] = i;
  if (t.kind === "vocab") {
    const w = WORDS[t.wid]; const right = t.mode === "choose" ? w.de : w.en; const ok = st.opts[i] === right;
    gradeWord(w, ok, t.mode === "listen" ? "listen" : "recognize");
    if (ok) clearMistake("w", w.id);
    return finishTask(ok, ok ? pick(["Richtig!", "Genau!", "Super!", "Sehr gut!"]) : "Nicht ganz.", `<b>${esc(w.de)}</b> = ${esc(w.en)}`);
  }
  if (t.kind === "article") {
    const w = WORDS[t.wid]; const ok = ["der", "die", "das"][i] === w.art; record(["vocab.article", "topic." + w.topic], ok);
    return finishTask(ok, ok ? "Richtig!" : "Nicht ganz.", `<b>${w.art} ${esc(w.noun)}</b> — ${esc(w.en)}`);
  }
  if (t.kind === "drill") {
    const ok = t.opts[i] === t.ans; record(["drill." + t.type], ok);
    return finishTask(ok, ok ? "Richtig!" : "Nicht ganz.", `Sie hörten: <b>${esc(t.say)}</b> = ${esc(t.ans)}`);
  }
  renderRunner(false);
}
function checkMulti() {
  const t = task(), st = R.st, kind = t.kind;
  const it = kind === "hoeren" ? hItem(t.id) : lItem(t.id);
  let c = 0;
  it.qs.forEach((q, qi) => { const ok = st.sel[qi] === q.a; if (ok) c++; recordItem(kind, it, qi, ok); });
  if (c === it.qs.length) clearMistake(kind, it.id);
  R.log.push({ kind, part: it.part, n: it.qs.length, c, id: it.id, mock: R.mock });
  st.logged = true;
  TTS.stop();
  const ok = c === it.qs.length;
  finishTask(ok, ok ? (it.qs.length > 1 ? "Alles richtig!" : "Richtig!") : (it.qs.length > 1 ? c + " von " + it.qs.length + " richtig" : "Nicht ganz."), R.mock ? "" : (kind === "hoeren" ? "Check the highlighted phrase in the transcript." : ""));
}
function checkRecall() {
  const t = task(), w = WORDS[t.wid], st = R.st;
  const val = $("#recall").value.trim(); st.typed = val;
  if (!val) return;
  let artOk = true, wordOk;
  const f = fold(val);
  if (w.art) {
    const m = f.match(/^(der|die|das)\s+(.+)$/);
    const noun = m ? m[2] : f;
    artOk = !!m && m[1] === w.art;
    const target = fold(w.noun); const d = lev(noun, target);
    wordOk = d === 0 || (target.length >= 6 && d === 1);
    st.typo = d === 1 && wordOk;
  } else { const target = fold(w.de); const d = lev(f, target); wordOk = d === 0 || (target.length >= 6 && d === 1); st.typo = d === 1 && wordOk; }
  const ok = wordOk && artOk;
  gradeWord(w, ok, "recall", artOk);
  if (ok) clearMistake("w", w.id);
  let msg = `<b>${esc(w.de)}</b> = ${esc(w.en)}`;
  if (wordOk && !artOk) msg = `Word right, article ${val.match(/^(der|die|das)\b/i) ? "wrong" : "missing"}: <b>${esc(w.de)}</b>`;
  if (ok && st.typo) msg += " · small typo, check the spelling";
  if (ok && w.noun && !/^(der|die|das)\s+[A-ZÄÖÜ]/.test(val)) msg += " · Nouns start with a capital letter.";
  finishTask(ok, ok ? "Richtig!" : wordOk ? "Fast!" : "Nicht ganz.", msg);
}
function checkWriting() {
  const t = task(), it = sItem(t.id), st = R.st;
  const mark = ok => { const k = "schreiben:" + it.id; const x = S.items[k] || (S.items[k] = { n: 0, c: 0 }); x.n++; if (ok) x.c++; x.last = dayNum(); x.ok = ok; };
  if (it.fields) {
    st.vals = it.fields.map((_, i) => $("#f" + i).value.trim());
    st.fieldOk = it.fields.map((f, i) => f.acc.some(a => fold(a) === fold(st.vals[i])));
    let c = 0; st.fieldOk.forEach(ok => { record(["schreiben." + it.lvl + ".1"], ok); if (ok) c++; });
    mark(c === it.fields.length);
    return finishTask(c === it.fields.length, c + " von " + it.fields.length + " Feldern richtig", "Read the text again for the red fields. The exam gives 1 point per field.");
  }
  const text = $("#wtext").value; st.text = text;
  const low = fold(text);
  st.pts = it.points.map(p => has(text, p.kw));
  st.greet = /^(liebe|lieber|hallo|hi|sehr geehrte|guten tag)/.test(low);
  st.close = /(gruesse|gruss|bis bald|bis dann|tschuess|tschuss|herzlich)/.test(low);
  st.wc = wordCount(text); const target = it.words || 30; st.len = st.wc >= Math.round(target * 0.7);
  const all = [...st.pts, st.greet, st.close, st.len];
  all.forEach(ok => record(["schreiben." + it.lvl + "." + it.part], ok));
  const c = all.filter(Boolean).length;
  mark(c >= all.length - 1);
  finishTask(c >= all.length - 1, c + " / " + all.length + " Punkte erfüllt", "This is a quick keyword check. For grammar feedback, ask Claude below.");
}
function checkSpeaking() {
  const t = task(), st = R.st, lvl = S.level;
  st.vals = st.cards.map((_, i) => $("#sp" + i).value);
  const type = lvl === "A1" ? ["", "intro", "card", "req"][t.part] : ["", "card", "tell", "plan"][t.part];
  const key = "sprechen." + lvl + "." + t.part;
  let marks = [];
  if (type === "intro") { st.pts = st.cards[0].prompts.map(p => has(st.vals[0], p.kw)); marks = st.pts; }
  else if (type === "card") {
    const W = ["wann", "wo", "wie", "was", "wer", "warum", "welche", "welchen", "welcher", "woher", "wohin"];
    st.pts = st.cards.map((c, i) => { const v = st.vals[i]; const f = fold(v); const first = f.split(" ")[0] || ""; const stem = fold(c.wort.replace("?", "")).slice(0, 5); return [v.includes("?"), f.includes(stem) || has(v, [c.thema.split(" ")[0]]), W.includes(first) || /(st|en|t)$/.test(first)]; });
    marks = st.pts.flat();
  } else if (type === "req") {
    st.pts = st.cards.map((c, i) => { const v = st.vals[i]; return [/bitte|koennen sie|kannst du|darf ich|ich moechte|ich haette gern/.test(fold(v)), has(v, c.kw)]; });
    marks = st.pts.flat();
  } else if (type === "tell") { st.pts = [wordCount(st.vals[0]) >= 40, /\b(und|aber|dann|weil|oft|danach|meistens|manchmal)\b/.test(fold(st.vals[0]))]; marks = st.pts; }
  else { const f = fold(st.vals[0]); st.pts = [/(\d|uhr|um )/.test(f), /\?|was meinst|geht es|passt|einverstanden|gute idee/.test(st.vals[0].toLowerCase() + f)]; marks = st.pts; }
  marks.forEach(ok => record([key], ok));
  const c = marks.filter(Boolean).length;
  finishTask(c >= marks.length - 1, c + " / " + marks.length + " erfüllt", "Now read the example out loud. Copy the rhythm.");
}

// ---------- Claude feedback (sample capability) ----------
let SAMPLE = null;
function aiBlock(kind) {
  const st = R.st;
  if (!SAMPLE) return "";
  if (st.ai) return `<div class="stack-s"><div class="eyebrow">Feedback von Claude</div>${st.ai}</div>`;
  return `<button class="btn block" data-act="ai-feedback" data-k="${kind}" ${st.aiBusy ? "disabled" : ""}>${ic("spark", 16)} ${st.aiBusy ? "Claude liest …" : "Get grammar feedback from Claude"}</button>`;
}
async function aiFeedback(kind) {
  const t = task(), st = R.st; if (!SAMPLE || st.aiBusy) return;
  let taskText, answer;
  if (kind === "w") { const it = sItem(t.id); taskText = "Goethe " + it.lvl + " Schreiben Teil " + it.part + ": " + it.task + " Points to cover: " + it.points.map(p => p.label).join("; ") + ". Target length about " + (it.words || 30) + " words."; answer = st.text; }
  else { taskText = "Goethe " + S.level + " Sprechen Teil " + t.part + " (" + PART_INFO[S.level].sprechen[t.part] + "). Cards: " + JSON.stringify(st.cards.map(c => c.wort || c.hint || c.title || "self-introduction")); answer = st.vals.join("\n---\n"); }
  if (!answer || !answer.trim()) { toast("Write something first."); return; }
  st.aiBusy = true; renderRunner(false);
  try {
    const res = await SAMPLE.json(`You are a friendly, strict Goethe-Institut examiner for level ${S.level}. The learner's first language is English.
Task: ${taskText}
Learner's answer (German):
"""${answer.slice(0, 2500)}"""
Reply with only JSON: {"score": <0-10 how this would score in the exam>, "verdict": "<one short English sentence>", "corrections": [{"wrong": "<exact phrase from the answer>", "right": "<corrected German>", "why": "<very short English reason>"}], "better": "<the learner's text rewritten as a strong ${S.level} answer, same ideas>", "tip": "<one concrete tip in English>"}. At most 6 corrections; only real errors.`, { modelTier: "default", cache: false });
    const cor = Array.isArray(res.corrections) ? res.corrections.slice(0, 6) : [];
    st.ai = `<div class="ai-out"><div class="row between"><b>${esc(res.verdict || "")}</b>${typeof res.score === "number" ? `<span class="chip ${res.score >= 7 ? "green" : res.score >= 5 ? "amber" : "red"} num">${res.score}/10</span>` : ""}</div>
      ${cor.length ? `<div style="margin-top:8px">${cor.map(c => `<div class="correction"><div><s>${esc(c.wrong)}</s> → <ins>${esc(c.right)}</ins></div><div class="tiny">${esc(c.why)}</div></div>`).join("")}</div>` : `<div class="tiny" style="margin-top:6px">No grammar errors found.</div>`}
      ${res.better ? `<div class="eyebrow" style="margin-top:10px">Stronger version</div><div style="margin-top:4px">${esc(res.better)}</div><button class="btn small" style="margin-top:8px" data-act="say" data-text="${esc(res.better)}">${ic("play", 14)} Anhören</button>` : ""}
      ${res.tip ? `<div class="hand blue" style="margin-top:8px">${esc(res.tip)}</div>` : ""}</div>`;
    S.writing.unshift({ d: TODAY(), k: kind, score: res.score ?? null }); S.writing = S.writing.slice(0, 20); Store.save();
  } catch (e) {
    if (e && (e.code === "not_granted" || e.code === "sampling_disabled" || e.code === "capability_disabled" || e.code === "not_declared")) { SAMPLE = null; st.ai = ""; }
    else st.ai = `<div class="notice">${e?.code === "rate_limited" ? "Claude is busy right now. Try again in a minute." : "Feedback didn't come through. Try again."}</div>`;
  } finally { st.aiBusy = false; if (R) renderRunner(false); }
}

// ---------- end of session ----------
function finishSession() {
  TTS.stop();
  if (R.daily) { S.dailyDone = TODAY(); S.doneDays = S.doneDays || {}; S.doneDays[TODAY()] = true; }
  const answered = R.tasks.length;
  const el = $("#runner");
  let body;
  if (R.mock) {
    const h = R.log.filter(x => x.kind === "hoeren"), l = R.log.filter(x => x.kind === "lesen");
    const sc = arr => { const n = arr.reduce((a, x) => a + x.n, 0), c = arr.reduce((a, x) => a + x.c, 0); return { n, c, pts: n ? Math.round(c / n * 25 * 10) / 10 : 0 }; };
    const H = sc(h), L = sc(l);

const P = {
  part(mod, part) {
    const lvl = S.level;
    if (mod === "hoeren") return { title: "Hören Teil " + part, tasks: chooseItems(allHoeren(), "hoeren", 5, x => x.lvl === lvl && x.part === part).map(it => ({ kind: "hoeren", id: it.id })) };
    if (mod === "lesen") return { title: "Lesen Teil " + part, tasks: chooseItems(LESEN, "lesen", 3, x => x.lvl === lvl && x.part === part).map(it => ({ kind: "lesen", id: it.id })) };
    if (mod === "schreiben") return { title: "Schreiben Teil " + part, tasks: chooseItems(SCHREIBEN, "schreiben", 1, x => x.lvl === lvl && x.part === part).map(it => ({ kind: "schreiben", id: it.id })) };
    return { title: "Sprechen Teil " + part, tasks: [{ kind: "sprechen", part }] };
  },
  drill(type, n = 10) { return { title: "Hörtraining", tasks: Array.from({ length: n }, (_, i) => makeDrill(type || weakestDrills(3)[i % 3])) }; },
  topic(tid) {
    const nw = shuffle(newWords(tid)).slice(0, 8);
    const seen = shuffle(TOPICS[tid].words.filter(w => S.words[w.id])).slice(0, 10);
    return { title: TOPICS[tid].de, tasks: [...nw.map(learnTask), ...shuffle([...nw.map(w => vocabTask(w, "recognize")), ...seen.map(w => vocabTask(w))])] };
  },
  due() { return { title: "Wiederholung", tasks: dueWords().slice(0, 25).map(w => vocabTask(w)) }; },
  articles() {
    const nouns = lvlWords().filter(w => w.art);
    const seen = nouns.filter(w => S.words[w.id]);
    const pool = seen.length >= 15 ? seen : nouns;
    return { title: "Artikel", tasks: shuffle(pool).slice(0, 15).map(w => ({ kind: "article", wid: w.id })) };
  },
  listenWords() {
    const seen = lvlWords().filter(w => S.words[w.id]);
    const pool = seen.length >= 10 ? seen : lvlWords();
    return { title: "Hör-Vokabeln", tasks: shuffle(pool).slice(0, 15).map(w => vocabTask(w, "listen")) };
  },
  trap(t) { return { title: "Hör-Fallen", tasks: chooseItems(allHoeren(), "hoeren", 6, x => x.lvl === S.level && (x.traps || []).includes(t)).map(it => ({ kind: "hoeren", id: it.id })) }; },
  mistakes() {
    const tasks = [];
    for (const m of S.mistakes.slice(0, 18)) {
      if (m.t === "w" && WORDS[m.id]) tasks.push(vocabTask(WORDS[m.id], S.words[m.id]?.b >= 3 ? "recall" : "choose"));
      if (m.t === "hoeren" && hItem(m.id)) tasks.push({ kind: "hoeren", id: m.id });
      if (m.t === "lesen" && lItem(m.id)) tasks.push({ kind: "lesen", id: m.id });
    }
    return { title: "Fehler", tasks };
  }
};
function goWeak(g) {
  if (g.mod) return startSession(P.part(g.mod, g.part));
  if (g.trap) return startSession(P.trap(g.trap));
  if (g.drill) return startSession(P.drill(g.drill));
  if (g.topic) return startSession(P.topic(g.topic));
  if (g.article) return startSession(P.articles());
}

// ---------- Claude-made listening items ----------
async function genHoeren() {
  if (!SAMPLE || UI.genBusy) return;
  const lvl = S.level, part = weakestPart("hoeren", lvl);
  const traps = Object.keys(TRAP_INFO).map(t => ({ t, v: (skillVal("trap." + t) ?? 0.5) + Math.random() * 0.15 })).sort((a, b) => a.v - b.v).slice(0, 2).map(x => x.t);
  const topics = topicsFor(lvl).map(t => ({ t, v: (skillVal("topic." + t.id) ?? 0.55) + Math.random() * 0.2 })).sort((a, b) => a.v - b.v).slice(0, 2).map(x => x.t);
  const fmt = { A1: { 1: "a short everyday dialogue between two people (A and B), 3–5 lines; one question with 3 options a/b/c", 2: "one public announcement (speaker N: station, airport, shop, radio), 2–3 sentences; one statement with options [\"Richtig\",\"Falsch\"]", 3: "one phone/voicemail message (speaker A), 3–5 sentences; one question with 3 options" },
    A2: { 1: "a radio or public announcement (speaker N), 3–4 sentences; one question with 3 options", 3: "a short everyday dialogue (A and B), 4–6 lines; one question with 3 options", 4: "a radio interview (A interviewer, B guest), 6–8 lines; five statements with options [\"Ja\",\"Nein\"]" } }[lvl][part];
  UI.genBusy = true; render();
  try {
    const res = await SAMPLE.json(`Write 3 NEW original listening exercises for the Goethe-Zertifikat ${lvl} exam, Hören Teil ${part}. Format of each: ${fmt}.
Target these weak spots of the learner: listening traps ${traps.map(t => TRAP_INFO[t][0] + " (" + TRAP_INFO[t][1] + ")").join(", ")}; themes ${topics.map(t => t.de).join(", ")}.
Use only ${lvl} vocabulary and grammar. Write every number, price, time and date as German WORDS in the script (e.g. "zwei Euro vierzig", "halb sieben") because it will be read by text-to-speech. Distractor options must be things actually mentioned in the text, as in the real exam.
Reply with only a JSON array of 3 objects: {"s": [["A","German line"],["B","German line"]], "qs": [{"q": "German question or statement", "en": "English translation of q", "o": ["option", "option", "option"], "oen": ["English translation of each option"], "a": <index of correct option>}], "key": "<exact short phrase from the script that gives the answer>", "ex": "<one-sentence English explanation of the trap>", "trap": "<one of: ${Object.keys(TRAP_INFO).join(", ")}>"}`, { modelTier: "default", cache: false });
    const arr = (Array.isArray(res) ? res : [res]).filter(x => x && Array.isArray(x.s) && Array.isArray(x.qs) && x.qs.every(q => Array.isArray(q.o) && Number.isInteger(q.a) && q.a >= 0 && q.a < q.o.length));
    if (!arr.length) throw { code: "invalid_json" };
    const made = arr.map((x, i) => ({ id: "gen-" + Date.now() + "-" + i, lvl, part, gen: true, topic: topics[0].id, traps: TRAP_INFO[x.trap] ? [x.trap] : traps.slice(0, 1),
      s: x.s.filter(l => Array.isArray(l) && l[1]).map(([sp, tx]) => [["A", "B", "N"].includes(sp) ? sp : "A", String(tx)]), qs: x.qs.map(q => ({ q: String(q.q), en: q.en ? String(q.en) : "", oen: Array.isArray(q.oen) && q.oen.length === q.o.length ? q.oen.map(String) : null, o: q.o.map(String), a: q.a })), key: String(x.key || ""), ex: String(x.ex || "") }));
    S.gen = [...made, ...(S.gen || [])].slice(0, 30); Store.save();
    UI.genBusy = false;
    startSession({ title: "Claude-Übung", tasks: made.map(it => ({ kind: "hoeren", id: it.id })) });
  } catch (e) {
    UI.genBusy = false;
    if (e && ["not_granted", "sampling_disabled", "not_declared", "capability_disabled"].includes(e.code)) SAMPLE = null;
    else toast(e?.code === "rate_limited" ? "Claude is busy. Try again in a minute." : "That didn't work. Try again.");
    render();
  }
}
